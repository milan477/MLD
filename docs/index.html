    <style>
        :root {
            --bg-0: #000002;
            --bg-1: #01030a;
            --bg-2: #030612;
            --text: #fff;
            --muted: #fff;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; }
        html, body { height: 100%; overflow: hidden; }
        body {
            background:
                radial-gradient(ellipse 70% 40% at 50% 108%, var(--bg-2) 0%, transparent 70%),
                radial-gradient(ellipse 120% 90% at 50% 0%, var(--bg-1) 0%, var(--bg-0) 100%);
            background-color: var(--bg-0);
            color: var(--text);
            font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
            -webkit-font-smoothing: antialiased;
        }

        header {
            position: fixed; top: 0; left: 0; right: 0; z-index: 30;
            display: flex; justify-content: space-between; align-items: flex-start;
            padding: 22px 28px; pointer-events: none;
        }
        header > * { pointer-events: auto; }
        #who { position: fixed; top: 22px; left: 50%; width: calc(100% - 280px); max-width: 620px; transform: translateX(-50%); z-index: 30; text-align: center; pointer-events: none; }
        .name { font-size: .9rem; font-weight: 600; letter-spacing: .06em; line-height: 1.25; color: #fff; }
        .tagline { position: fixed; bottom: 16px; left: 0; right: 0; z-index: 30; text-align: center; font-size: .68rem; color: var(--muted); letter-spacing: .06em; pointer-events: none; }
        nav { display: flex; gap: 20px; align-items: center; font-size: .85rem; }
        nav a, nav button { color: var(--muted); text-decoration: none; background: none; border: 0; cursor: pointer; font: inherit; transition: color .2s; }
        nav a:hover, nav button:hover { color: #fff; }
        nav img { height: 18px; filter: invert(1) brightness(.7); vertical-align: middle; }
        nav a:hover img { filter: invert(1) brightness(1); }

        /* ---------- stage: context above, bar in the middle, answer below ---------- */
        #stage { position: fixed; inset: 84px 0 24px 0; z-index: 10; overflow: hidden; --bar: 52px; --gap: 56px; }   /* --gap: space between the bar and the text above / the suggestions below */
        #stage > * { position: absolute; left: 50%; transform: translateX(-50%); }

        #below {
            top: calc(50% + var(--bar) / 2 + var(--gap)); width: min(1120px, calc(100% - 48px));
            max-height: calc(50% - var(--bar) / 2 - var(--gap)); overflow-y: auto; scrollbar-width: none;
        }
        #below::-webkit-scrollbar { display: none; }
        #context { display: flex; flex-wrap: wrap; justify-content: center; gap: 24px; padding: 32px 6px 32px; }
        #contextLabel {
            width: 100%; text-align: center; font-size: .68rem; letter-spacing: .22em; text-transform: uppercase;
            color: #8d97b5; margin-bottom: 2px;
        }
        #answer:empty { display: none; }

        .card {
            position: relative; width: min(360px, 100%); flex: 0 1 360px; border-radius: 20px; overflow: hidden; cursor: pointer;
            background: radial-gradient(ellipse 120% 90% at 50% 100%, rgba(255, 255, 255, .07), rgba(255, 255, 255, .02));
            box-shadow: 0 0 40px rgba(255, 255, 255, .06), 0 12px 40px rgba(0, 0, 0, .35);
            opacity: 0; transform: translateY(-14px) scale(.97);
            animation: cardIn .6s cubic-bezier(.2, .8, .25, 1) forwards; animation-delay: calc(var(--i) * 110ms);
            transition: box-shadow .25s, background .25s;
            outline: none;
        }
        @keyframes cardIn { to { opacity: 1; transform: none; } }
        .card:hover, .card:focus-visible { box-shadow: 0 0 56px rgba(255, 255, 255, .16), 0 12px 40px rgba(0, 0, 0, .4); background: radial-gradient(ellipse 120% 90% at 50% 100%, rgba(255, 255, 255, .12), rgba(255, 255, 255, .04)); }
        .card .thumb { height: 92px; background-size: cover; background-position: center top; mask-image: linear-gradient(to bottom, #000 40%, transparent); -webkit-mask-image: linear-gradient(to bottom, #000 40%, transparent); opacity: .9; }
        .card .body { padding: 22px 26px 26px; }
        .card:only-child { width: min(520px, 100%); flex-basis: 520px; }
        .card.has-thumb .body { margin-top: -26px; position: relative; }
        .card .kind { font-size: .62rem; letter-spacing: .18em; text-transform: uppercase; color: #8d97b5; margin-bottom: 5px; }
        .card h3 { font-size: 1.05rem; font-weight: 600; color: #fff; margin-bottom: 12px; text-shadow: 0 0 18px rgba(255, 255, 255, .45); }
        .card p { font-size: .9rem; line-height: 1.75; color: #c6cce2; display: -webkit-box; -webkit-line-clamp: 5; -webkit-box-orient: vertical; overflow: hidden; }
        mark { background: none; color: #fff; text-shadow: 0 0 10px rgba(255, 255, 255, .9), 0 0 24px rgba(255, 255, 255, .5); font-weight: 600; }

        /* ---------- the bar, held only by light ---------- */
        #field { top: 50%; width: min(620px, calc(100% - 40px)); transform: translate(-50%, -50%) !important; --charge: 0; }
        #glow { position: absolute; inset: -30px -48px; pointer-events: none; transition: opacity .5s; opacity: calc(.72 + var(--charge) * .28); }
        #glow i { position: absolute; border-radius: 50%; mix-blend-mode: screen; filter: blur(34px); transition: opacity .4s; }
        #glow .g1 { left: 6%;  top: 8%;  width: 52%; height: 84%; background: radial-gradient(circle, rgba(255, 246, 238, .95), transparent 70%); animation: sway1 11s ease-in-out infinite; }
        #glow .g2 { right: 2%; top: 4%;  width: 50%; height: 90%; background: radial-gradient(circle, rgba(255, 190, 214, .8), transparent 70%); animation: sway2 13s ease-in-out infinite; }
        #glow .g3 { left: 26%; top: -6%; width: 46%; height: 92%; background: radial-gradient(circle, rgba(184, 196, 255, .85), transparent 70%); animation: sway3 15s ease-in-out infinite; }
        #glow .g4 { left: 30%; top: 22%; width: 44%; height: 86%; background: radial-gradient(circle, rgba(168, 236, 228, .6), transparent 70%); animation: sway1 17s ease-in-out infinite reverse; }
        @keyframes sway1 { 50% { transform: translate(8%, -8%) scale(1.1); } }
        @keyframes sway2 { 50% { transform: translate(-9%, 7%) scale(.93); } }
        @keyframes sway3 { 50% { transform: translate(6%, 10%) scale(1.07); } }
        body.asked #field { width: min(820px, calc(100% - 64px)); }
        body.asked #stage { --gap: 76px; }
        #field.busy #glow i { animation-duration: 3s; }
        #bar {
            position: relative; display: flex; align-items: center; gap: 10px;
            height: var(--bar); padding: 0 8px 0 22px; border-radius: 999px;
            background: rgba(1, 2, 8, .9);
        }
        #q { flex: 1; min-width: 0; background: none; border: 0; outline: 0; color: #fff; font: inherit; font-size: .94rem; caret-color: #fff; }
        #q::placeholder { color: rgba(255, 255, 255, .7); }
        #send {
            width: 34px; height: 34px; border-radius: 50%; border: 0; cursor: pointer; color: #fff; font-size: 1.05rem;
            background: rgba(255, 255, 255, .08); transition: background .2s, box-shadow .2s; flex-shrink: 0;
        }
        #send:hover { background: rgba(255, 255, 255, .2); box-shadow: 0 0 22px rgba(255, 255, 255, .35); }

        #chips { display: flex; flex-wrap: wrap; justify-content: center; gap: 12px; }
        #chips button { animation: chipIn .6s ease backwards; animation-delay: calc(var(--n) * 60ms); }
        @keyframes chipIn { from { opacity: 0; transform: translateY(8px); } }
        #chips button {
            background: rgba(255, 255, 255, .05); border: 0; color: #c3c9de; font: inherit; font-size: .75rem;
            padding: 6px 12px; border-radius: 999px; cursor: pointer; white-space: nowrap; transition: background .2s, color .2s, box-shadow .2s;
        }
        #chips button:hover { background: rgba(255, 255, 255, .13); color: #fff; box-shadow: 0 0 20px rgba(255, 255, 255, .2); }

        /* ---------- conversation: newest turn is full, older turns fold into keywords ---------- */
        #answer { bottom: calc(50% + var(--bar) / 2 + var(--gap)); width: min(920px, calc(100% - 64px)); max-height: calc(50% - var(--bar) / 2 - var(--gap)); overflow-y: auto;
            text-align: center; padding: 8px 8px 0; display: flex; flex-direction: column; align-items: stretch; scrollbar-width: none;
            -webkit-mask-image: linear-gradient(transparent, #000 36px); mask-image: linear-gradient(transparent, #000 36px); }
        #answer::-webkit-scrollbar { display: none; }
        #answer > :first-child { margin-top: auto; }
        .turn { padding: 8px 0 30px; cursor: default; }
        .turn:last-child { padding-bottom: 0; }
        .turn.old { cursor: pointer; }
        .turn .q { --muted: #8d97b5; display: block; width: 100%; background: none; border: 0; font: inherit; cursor: inherit; text-align: center;
            font-size: .75rem; letter-spacing: .12em; color: var(--muted); padding: 4px 0 14px; transition: color .4s, letter-spacing .6s; }
        .turn.old .q { color: #6c7699; letter-spacing: .06em; }
        .turn.old:hover .q { color: #c8cfe6; }
        .turn.hold .fold.a { display: none; }                       /* a new exchange shows its question first; the answer is let in after */
        .turn.old .fold.a { display: none; }                       /* the layout snaps; JS animates the change (FLIP) */
        .turn:not(.old) .fold.k { display: none; }
        .turn .text { font-size: 1.06rem; line-height: 1.85; color: #fff; text-shadow: 0 0 20px rgba(255, 255, 255, .28), 0 0 50px rgba(255, 255, 255, .12); padding: 2px 4px; }
        .turn .text.wait { color: var(--muted); animation: pulse 1.2s ease-in-out infinite; }
        @keyframes pulse { 50% { opacity: .35; } }
        .turn .text span { display: inline-block; white-space: pre-wrap; }
        .turn .text a { color: #fff; text-decoration: underline; text-decoration-color: rgba(255, 255, 255, .45); text-underline-offset: 3px; text-shadow: 0 0 14px rgba(255, 255, 255, .75); cursor: pointer; }
        .turn .text a:hover { text-decoration-color: #fff; }
        /* the one-sentence summary a folded turn leaves behind */
        .sum { font-size: .95rem; line-height: 1.8; color: #fff; padding: 2px 10px 4px; }
        .sum span { display: inline-block; white-space: pre-wrap; }
        .sum span.kwd { color: #fff; }

        /* ---------- catalog ---------- */
        #catalog {
            position: fixed; inset: 0; z-index: 28; overflow-y: auto; padding: 96px 28px 84px;
            background: radial-gradient(ellipse 80% 50% at 50% 0%, var(--bg-2), var(--bg-0) 70%);
            opacity: 0; visibility: hidden; transition: opacity .45s ease, visibility .45s;
            scrollbar-width: thin; scrollbar-color: rgba(255, 255, 255, .2) transparent;
        }
        body.is-catalog #catalog { opacity: 1; visibility: visible; }
        body.is-catalog header { background: linear-gradient(rgba(0, 0, 2, .96) 55%, transparent); }
        nav button.on { color: #fff; text-shadow: 0 0 14px rgba(255, 255, 255, .6); }
        #catalog h2.sec { font-size: .72rem; font-weight: 500; letter-spacing: .2em; text-transform: uppercase; color: #8d97b5; margin: 48px 0 0; padding-bottom: 12px; border-bottom: 1px solid rgba(255, 255, 255, .16); }
        #catalog h2.sec:first-child { margin-top: 0; }
        #collage { max-width: 920px; margin: 0 auto; }
        .tile {
            display: grid; grid-template-columns: 40px minmax(0, 1fr) 132px; gap: 0 24px; align-items: start;
            padding: 24px 10px; border-bottom: 1px solid rgba(255, 255, 255, .09); cursor: pointer; outline: none;
            opacity: 0; animation: tileIn .5s ease forwards; animation-delay: calc(var(--i) * 30ms); transition: background .2s;
        }
        @keyframes tileIn { to { opacity: 1; } }
        .tile:hover, .tile:focus-visible { background: rgba(255, 255, 255, .035); }
        .tile .num { color: #6c7699; font-size: .78rem; letter-spacing: .06em; font-variant-numeric: tabular-nums; padding-top: 5px; }
        .tile h3 { font-size: 1.12rem; font-weight: 600; color: #fff; line-height: 1.3; }
        .tile:hover h3 { text-decoration: underline; text-decoration-color: rgba(255, 255, 255, .4); text-underline-offset: 4px; }
        .tile p { margin-top: 7px; font-size: .9rem; line-height: 1.6; color: #fff; max-width: 62ch; }
        .tile .tags { display: flex; flex-wrap: wrap; gap: 4px 0; margin-top: 11px; font-size: .74rem; color: #8d97b5; }
        .tile .tags span + span::before { content: "·"; margin: 0 9px; color: #565f7f; }
        .tile .thumb { width: 132px; height: 86px; border-radius: 6px; background-size: cover; background-position: center top; border: 1px solid rgba(255, 255, 255, .12); }
        @media (max-width: 760px) {
            #catalog { padding: 80px 16px 70px; }
            .tile { grid-template-columns: 30px minmax(0, 1fr); gap: 0 12px; padding: 20px 4px; }
            .tile .thumb { display: none; }
        }

        /* ---------- detail box ---------- */
        #box {
            position: fixed; left: 50%; top: 50%; z-index: 40;
            width: min(760px, 92vw); height: min(74vh, 660px);
            transform: translate(-50%, -46%) scale(.96);
            border-radius: 24px; opacity: 0; pointer-events: none;
            background: rgba(1, 2, 8, .96);
            box-shadow: 0 30px 90px rgba(0, 0, 0, .6), 0 0 120px rgba(255, 255, 255, .08);
            overflow: hidden; transition: opacity .45s ease, transform .55s cubic-bezier(.2, .8, .25, 1);
        }
        #box::before { content: ""; position: absolute; left: 0; right: 0; bottom: 0; height: 45%; pointer-events: none; background: radial-gradient(ellipse 60% 100% at 50% 130%, rgba(255, 255, 255, .12), transparent 70%); }
        #box.open { opacity: 1; transform: translate(-50%, -50%) scale(1); pointer-events: auto; }
        #box .scroll { position: absolute; inset: 0; overflow-y: auto; padding: 36px 40px 44px; scrollbar-width: thin; scrollbar-color: rgba(255, 255, 255, .25) transparent; }
        #close { position: absolute; top: 14px; right: 16px; z-index: 2; width: 34px; height: 34px; border-radius: 50%; background: rgba(255, 255, 255, .06); border: 0; color: var(--text); font-size: 1rem; cursor: pointer; transition: background .2s; }
        #close:hover { background: rgba(255, 255, 255, .16); }
        #veil { position: fixed; inset: 0; z-index: 35; background: rgba(0, 0, 2, .6); opacity: 0; pointer-events: none; transition: opacity .4s; }
        #veil.open { opacity: 1; pointer-events: auto; }
        .scroll h2 { font-size: 1.9rem; font-weight: 600; color: #fff; text-shadow: 0 0 22px rgba(255, 255, 255, .55), 0 0 60px rgba(255, 255, 255, .25); margin-bottom: 10px; padding-right: 36px; }
        .scroll .lede { color: #fff; font-size: 1.02rem; line-height: 1.6; margin-bottom: 16px; }
        .scroll .tags { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 24px; }
        .scroll .tag { font-size: .72rem; letter-spacing: .06em; padding: 4px 11px; border-radius: 999px; background: rgba(255, 255, 255, .07); color: var(--text); }
        .scroll p, .scroll li { color: var(--text); font-size: .98rem; line-height: 1.75; margin-bottom: 15px; text-shadow: 0 0 18px rgba(255, 255, 255, .2); }
        .scroll a { color: #fff; text-shadow: 0 0 12px rgba(255, 255, 255, .6); text-decoration-color: rgba(255, 255, 255, .5); }
        .scroll img { max-width: 100%; border-radius: 12px; margin: 6px 0 18px; box-shadow: 0 0 40px rgba(255, 255, 255, .1); }
        .scroll iframe { width: 100%; border: 0; border-radius: 12px; margin: 6px 0 18px; }
        .scroll iframe[src*="youtube"] { aspect-ratio: 16 / 9; height: auto; }
        .scroll iframe[src$=".pdf"] { height: 520px; background: #fff; }
        .scroll audio { width: 100%; margin: 2px 0 22px; filter: invert(.9) brightness(.9); }
        .scroll .demo-link { display: inline-block; margin: 4px 0 14px; }
        .scroll h4 { color: #fff; font-size: 1.15rem; text-shadow: 0 0 16px rgba(255, 255, 255, .5); margin: 24px 0 8px; }
        .scroll h3 { color: #fff; font-size: 1.05rem; text-shadow: 0 0 16px rgba(255, 255, 255, .5); margin: 22px 0 6px; }
        .scroll .education-item { margin-bottom: 18px; }
        .scroll .education-header { display: flex; justify-content: space-between; gap: 12px; flex-wrap: wrap; }
        .scroll .education-degree { margin: 0; }
        .scroll .education-timespan, .scroll .education-subheader { color: var(--muted); font-size: .85rem; display: flex; gap: 12px; flex-wrap: wrap; }

        @media (max-width: 760px) {
            #who { top: 58px; width: calc(100% - 32px); }
            #catalog { padding-top: 110px; }
        }
        @media (max-width: 640px) {
            header { padding: 16px; }
            nav { gap: 14px; font-size: .78rem; }
            #who { top: 56px; width: calc(100% - 32px); }
            .name { font-size: .72rem; letter-spacing: .03em; }
            .tagline { font-size: .6rem; }
            #stage { inset: 88px 0 20px 0; --bar: 48px; --gap: 44px; }
            #chips button:nth-child(n+4) { display: none; }
            #answer { width: calc(100% - 32px); }
            #below { width: calc(100% - 24px); }
            body.asked #field { width: calc(100% - 32px); }
            body.asked #stage { --gap: 44px; }
            #context { gap: 16px; padding: 24px 4px; }
            .card, .card:only-child { width: 100%; flex-basis: 100%; }
            .card .body { padding: 20px; }
            .card p { -webkit-line-clamp: 5; font-size: .85rem; }
            .turn { padding-bottom: 24px; }
            .turn .text { font-size: .98rem; line-height: 1.75; }
            #bar { padding-left: 22px; }
            #glow { inset: -28px -24px; }
            #box .scroll { padding: 28px 22px 32px; }
            .scroll h2 { font-size: 1.5rem; }
        }
        @media (prefers-reduced-motion: reduce) {
            #glow i { animation: none; }
            .card, .turn .text span, .kw { animation-duration: .01s; animation-delay: 0s; transition-duration: .01s; }
        }
    </style>

    <script>
    (() => {
        const $ = (s) => document.querySelector(s);
        const clamp = (v, lo, hi) => Math.max(lo, Math.min(hi, v));
        const esc = (s) => s.replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));


        /* =========================================================
           Knowledge base: everything on the site, cut into chunks
           ========================================================= */
        const parse = (html) => new DOMParser().parseFromString(`<body>${html}</body>`, 'text/html').body;
        const clean = (t) => t.replace(/\s+/g, ' ').trim();
        const sentences = (t) => {
            const out = []; let cur = '';
            clean(t).split(' ').forEach((w) => {
                cur += (cur ? ' ' : '') + w;
                // sentence ends at . ! ? unless it is an abbreviation like "M.Eng." or a lone initial
                if (/[.!?]["”)]?$/.test(w) && !/^(?:[A-Za-z]{1,4}\.){2,}$/.test(w) && !/^[A-Z]\.$/.test(w) && !/^(?:e\.g|i\.e|vs|etc|Dr|Mr|Ms)\.$/i.test(w)) { out.push(cur); cur = ''; }
            });

            input.value = ''; input.blur();
            document.body.classList.add('asked');
            field.classList.add('busy'); field.style.setProperty('--charge', 1);
            const t = { q: question, text: '', keys: [], picks: [], cardsHTML: '', done: false, el: makeTurn(question) };
            // first the open answer folds away, and only then does the new exchange appear
            chain = chain.then(async () => {
                await setFocus(null, () => { turns.push(t); ans.appendChild(t.el); while (turns.length > MAXTURNS) { turns.shift().el.remove(); } renderChips(); });
                release(t); // open the answer space after the question movement finishes
            });
            renderChips();
            setTimeout(() => { field.classList.remove('busy'); field.style.setProperty('--charge', 0); respond(t); }, 180);
        }

        // choose which pieces of the site answer this question
        function select(r, greet) {
            const stems = new Set([...r.qt, ...r.ex]), picks = [], top = r.scored[0];
            if (!greet && top && (r.named.length || top.sc > 1.1)) {
                const cutoff = r.named.length ? 0 : top.sc * .42, perSrc = {}, max = 4;
                r.named.slice(0, max).forEach((n) => { const x = r.scored.find((y) => y.c.src === n.id); if (x) { perSrc[n.id] = 1; picks.push(x); } });
                for (const x of r.scored) {
                    if (picks.includes(x)) continue;
                    if (r.named.length && !r.named.some((n) => n.id === x.c.src)) continue;   // a named project: show only that
                    if (x.sc < cutoff && picks.length) break;
                    const lim = r.named.some((s) => s.id === x.c.src) ? 3 : 2;
                    if ((perSrc[x.c.src] || 0) >= lim) continue;
                    if (!perSrc[x.c.src] && Object.keys(perSrc).length >= max) continue;
                    perSrc[x.c.src] = (perSrc[x.c.src] || 0) + 1; picks.push(x);
                    if (picks.length >= 6) break;
                }
                if (r.named.length) picks.sort((a, b) => a.c.i - b.c.i);   // overview first
            }
            return { picks, stems };
        }
        function localAnswer(picks, stems) {
            const cand = [], whole = (k) => ['Education', 'Contact'].includes(sources[k].kind);
            if (picks.every((x) => sources[x.c.src].kind === 'Education')) picks.sort((a, b) => a.c.i - b.c.i);
            const eduOnly = picks.every((x) => sources[x.c.src].kind === 'Education');
            picks.slice(0, eduOnly ? 4 : 3).forEach((x, pi) => (whole(x.c.src) ? [x.c.say || x.c.text] : sentences(x.c.text)).forEach((s, si) => {
                const n = toks(s).filter((t) => stems.has(t)).length;
                cand.push({ s, n: n + (pi === 0 ? .5 : 0) - si * .05, pi, si });
            }));
            return cand.sort((a, b) => b.n - a.n).slice(0, eduOnly ? 4 : 3).sort((a, b) => a.pi - b.pi || a.si - b.si).map((c) => c.s).join(' ');
        }
        const firstSentence = (text) => {
            let x = sentences(text)[0] || text;
            if (x.length > 150) { x = x.slice(0, 150); x = x.slice(0, x.lastIndexOf(' ')).replace(/[,;:\s]+$/, '') + '…'; }
            return x;
        };
        // keywords for answers that didn't come from the model: titles / question words that the summary actually contains
        function fallbackKeys(t) {
            const hay = t.sum.toLowerCase(), out = [];
            groupBySource(t.picks).forEach((g) => { const ti = sources[g.src].title; if (hay.includes(ti.toLowerCase())) out.push(ti); });
            (t.q.match(/[A-Za-z0-9\u00c0-\u024f-]+/g) || []).forEach((w) => { if (!STOP.has(w.toLowerCase()) && w.length > 3 && hay.includes(w.toLowerCase()) && !out.some((o) => o.toLowerCase().includes(w.toLowerCase()))) out.push(w); });
            return out.slice(0, 3);
        }

        function respond(t) {
            const q = t.q, prev = [...turns].reverse().find((x) => x !== t && x.done);
            const greet = /^\s*(hi|hello|hey|yo|hallo|good (morning|evening|afternoon))\b[\s!.?]*$/i.test(q);
            let r = retrieve(q), sel = select(r, greet), augmented = false;
            if (!sel.picks.length && !greet && prev) {      // a follow-up like "tell me more": borrow the previous exchange's topic
                const r2 = retrieve([...prev.keys, prev.sum || '', ...(prev.picks.length ? groupBySource(prev.picks).map((g) => sources[g.src].title) : []), q].join(' '));
                const s2 = select(r2, false);
                if (s2.picks.length) { r = r2; sel = s2; augmented = true; }
            }
            const { picks, stems } = sel;
            t.picks = picks;

            let local;
            if (greet) local = "Hi! I can tell you about my projects, research, studies and music. Try one of the questions below, or ask your own.";
            else if (!picks.length) local = "I don't have anything on that. I can talk about my projects, research, studies, music and how to get in touch.";
            else local = (r.named.length === 1 && prewritten(projectKey(r.named[0].title)))?.t || localAnswer(picks, stems);

            // context cards: one per source, never repeated
            if (picks.length) {
                const cards = groupBySource(picks).map((g) => ({ c: g.chunks[0] }));
                t.cardsHTML = cards.map((x, i) => {
                    const s = sources[x.c.src], thumb = !!s.image;
                    return `<div class="card${thumb ? ' has-thumb' : ''}" style="--i:${i}" tabindex="0" role="button" data-src="${s.id}" aria-label="Open ${esc(s.title)}">
                        ${thumb ? `<div class="thumb" style="background-image:url('${s.image}')"></div>` : ''}
                        <div class="body"><div class="kind">${s.kind}</div><h3>${esc(s.title)}</h3><p>${hl(snippet(x.c, stems), stems)}</p></div></div>`;
                }).join('');
                if (t.el.isConnected && turns[focus] === t) { ctx.innerHTML = t.cardsHTML; ctxWrap.classList.add('show'); }
            }

            const useAI = !!window.CHAT_API && picks.length && !greet;
            const key = cacheKey(q), hit = !greet && !augmented && cacheGet(key);
            if (hit) finish(t, hit.t, hit.k, false, hit.s);                       // reviewed reply: paced presentation, no API call
            else if (useAI) streamAnswer(t, local, key, !augmented);
            else finish(t, local, null);
        }

        // write the final answer, its one-sentence summary and keywords into the turn
        function finish(t, text, keys, settled, summary) {
            t.text = text; t.sum = (summary && summary.trim()) || firstSentence(text); t.done = true;
            t.keys = (keys && keys.length ? keys : fallbackKeys(t)).slice(0, 4);
            const tx = t.el.querySelector('.text');
            tx.classList.remove('wait');
            tx.innerHTML = wordsHTML(text, false);
            t.streamed = !!settled;
            if (!settled && !reduceMotion && !t.el.classList.contains('hold')) reveal(t);
            t.el.querySelector('.sum').innerHTML = t.sum.split(' ').map((w, i) => `<span style="--w:${i}">${esc(w)}</span>`).join(' ');
            locateKeywords(t);
            pinBottom(t);
        }

        /* ---------- OpenRouter (through the worker) ---------- */
        // the model ends its reply with "SUMMARY: ..." and "KEYWORDS: a | b"; split them off the answer
        const MS = /\n?[ \t]*SUMMARY[ \t]*:/i, MK = /\n?[ \t]*KEYWORDS[ \t]*:/i;
        function parseOut(got, final) {
            const ms = MS.exec(got), mk = MK.exec(got);
            const cutAt = Math.min(...[ms, mk].filter(Boolean).map((m) => m.index));
            if (isFinite(cutAt)) {
                const sumEnd = ms ? (mk && mk.index > ms.index ? mk.index : got.length) : 0;
                return {
                    text: got.slice(0, cutAt).trim(),
                    summary: ms ? got.slice(ms.index + ms[0].length, sumEnd).replace(/\s+/g, ' ').trim() : '',
                    keys: final && mk ? got.slice(mk.index + mk[0].length).split(/[|\n]/).map((x) => x.replace(/[.\s]+$/, '').trim()).filter((x) => x && x.length < 32).slice(0, 4) : []
                };
            }
            let text = got;                                           // hide a half-typed marker while streaming
            const nl = got.lastIndexOf('\n');
            if (nl >= 0) { const tail = got.slice(nl + 1).toUpperCase(); if (tail && ('SUMMARY:'.startsWith(tail) || 'KEYWORDS:'.startsWith(tail))) text = got.slice(0, nl); }
            return { text: text.trimEnd(), summary: '', keys: [] };
        }
        async function streamAnswer(t, fallbackText, key, cacheable) {
            const el = t.el.querySelector('.text');
            const hist = turns.filter((x) => x !== t && x.done && x.text).slice(-3).map((x) => ({ q: x.q, a: x.text.slice(0, 700) }));
            let got = '';
            try {
                const res = await fetch(window.CHAT_API, {
                    method: 'POST', headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        question: t.q, history: hist,
                        context: groupBySource(t.picks).map((g) => ({ title: sources[g.src].title, text: chunks.filter((c) => c.src === g.src).map((c) => c.say || c.text).join('\n').slice(0, 3800) }))
                    })
                });
                if (!res.ok || !res.body) throw new Error('bad status ' + res.status);
                const rd = res.body.getReader(), dec = new TextDecoder(); let buf = '';
                for (;;) {
                    const { done, value } = await rd.read(); if (done) break;
                    buf += dec.decode(value, { stream: true });
                    const lines = buf.split('\n'); buf = lines.pop();
                    for (const ln of lines) {
                        if (!ln.startsWith('data:')) continue;
                        const d = ln.slice(5).trim(); if (!d || d === '[DONE]') continue;
                        try { got += JSON.parse(d).choices?.[0]?.delta?.content || ''; } catch {}
                    }
                    const shown = parseOut(got, false).text.trimStart();
                    if (shown) { el.classList.remove('wait'); el.innerHTML = shown.split(' ').map((w, i, a) => linkWord(w, a[i - 1] || '')).join(' '); pinBottom(t); }
                }
                const fin = parseOut(got, true);
                if (!fin.text) throw new Error('empty');
                finish(t, fin.text, fin.keys, true, /[.!?…]$/.test(fin.summary) ? fin.summary : '');
                if (cacheable && fin.summary && /[.!?…]$/.test(fin.summary) && fin.keys.length) cachePut(key, { t: fin.text, s: t.sum, k: t.keys });   // only complete replies are kept
            } catch (err) {
                if (!got.trim()) finish(t, fallbackText, null);       // worker down / not configured: quote the page instead
                else { const fin = parseOut(got, true); finish(t, fin.text || fallbackText, fin.keys, true, fin.summary); }
            }
        }
        field.addEventListener('submit', (e) => { e.preventDefault(); ask(input.value); });

        /* ---------- detail box ---------- */
        const box = $('#box'), veil = $('#veil'), content = $('#content');
        function openSource(id) {
            const s = sources[id]; if (!s) return;
            if (s.project) {
                const p = s.project;
                content.innerHTML = `<h2>${esc(p.title)}</h2><p class="lede">${esc(p.desc)}</p><div class="tags">${p.tags.map((t) => `<span class="tag">${esc(t)}</span>`).join('')}</div>${p.body.join('')}`;
            } else if (s.contact) {
                content.innerHTML = `<h2>Get in touch</h2><p><a href="mailto:milanliessensdujardin@gmail.com">milanliessensdujardin@gmail.com</a></p><p><a href="https://www.linkedin.com/in/milan-liessens-dujardin/">LinkedIn</a> · <a href="https://github.com/milan477">GitHub</a></p>`;
            } else {
                content.innerHTML = `<h2>About me</h2><div>${window.ABOUT.bio}</div><h3>Education</h3>${window.ABOUT.edu}`;
            }
            content.querySelectorAll('a[href^="http"]').forEach((a) => { a.target = '_blank'; a.rel = 'noopener'; });
            content.scrollTop = 0;
            box.classList.add('open'); veil.classList.add('open');
        }
        function closeBox() { box.classList.remove('open'); veil.classList.remove('open'); setTimeout(() => { if (!box.classList.contains('open')) content.innerHTML = ''; }, 500); }
        ctx.addEventListener('click', (e) => { const c = e.target.closest('.card'); if (c) openSource(c.dataset.src); });
        ctx.addEventListener('keydown', (e) => { if ((e.key === 'Enter' || e.key === ' ') && e.target.classList.contains('card')) { e.preventDefault(); openSource(e.target.dataset.src); } });
        $('#close').addEventListener('click', closeBox); veil.addEventListener('click', closeBox);
        addEventListener('keydown', (e) => { if (e.key === 'Escape') { if (box.classList.contains('open')) closeBox(); else toggleCatalog(false); } });


        /* ---------- catalog: every project and post, collaged ---------- */
        const TINTS = ['255,190,214', '184,196,255', '168,236,228', '255,225,190'];
        (function buildCatalog() {
            const col = $('#collage');
            // short text for sources that aren't projects/posts (About, education, contact)
            const blurb = (id) => { const cs = chunks.filter((c) => c.src === id); return (cs[id === 'about' ? 1 : 0] || cs[0]).say || (cs[id === 'about' ? 1 : 0] || cs[0]).text; };
            const sec = (t) => `<h2 class="sec">${t}</h2>`;
            const tile = (id, i, k) => {
                const s = sources[id], p = s.project || { desc: blurb(id) }, tags = (s.tags || []).slice(0, 4);
                return `<div class="tile" tabindex="0" role="button" data-src="${id}" aria-label="Open ${esc(s.title)}" style="--i:${i}">
                    <span class="num">${String(k + 1).padStart(2, '0')}</span>
                    <div><h3>${esc(s.title)}</h3><p>${esc(p.desc)}</p>${tags.length ? `<div class="tags">${tags.map((t) => `<span>${esc(t)}</span>`).join('')}</div>` : ''}</div>
                    ${s.image ? `<div class="thumb" style="background-image:url('${s.image}')"></div>` : '<div></div>'}</div>`;
            };
            const ids = (prefix) => Object.keys(sources).filter((k) => k.startsWith(prefix) && sources[k].project && (prefix === 'p' ? !k.startsWith('post') : true));
            let n = 0;
            const list = (arr) => arr.map((id, k) => tile(id, n++, k)).join('');
            col.innerHTML = sec('Projects') + list(ids('p'));
        })();
        const catBtn = $('#catalogBtn');
        function toggleCatalog(on) {
            on = on ?? !document.body.classList.contains('is-catalog');
            document.body.classList.toggle('is-catalog', on);
            catBtn.classList.toggle('on', on);
            document.querySelectorAll('.main-nav a').forEach(a => a.removeAttribute('aria-current'));
            document.querySelector(on ? '[data-nav=projects]' : '[data-nav=chat]').setAttribute('aria-current', 'page');
            if (on) $('#catalog').scrollTop = 0;
        }
        catBtn.addEventListener('click', (e) => { e.preventDefault(); toggleCatalog(true); });
        if (new URLSearchParams(location.search).get('view') === 'projects') toggleCatalog(true);
        $('#collage').addEventListener('click', (e) => { const t = e.target.closest('.tile'); if (t) openSource(t.dataset.src); });
        $('#collage').addEventListener('keydown', (e) => { if ((e.key === 'Enter' || e.key === ' ') && e.target.classList.contains('tile')) { e.preventDefault(); openSource(e.target.dataset.src); } });

        renderChips();
        const qp = new URLSearchParams(location.search).get('q');
        if (qp) setTimeout(() => ask(qp), 300);
    })();
    </script>
